name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '30 7 * * *' # Runs daily at 1:00 PM IST (7:30 AM UTC)
  workflow_dispatch: # Allows manual run trigger from the Actions tab in GitHub
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install
    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps
    - name: Run Playwright tests
      env:
        BASE_URL: ${{ secrets.BASE_URL }}
        LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
        LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
      run: npx playwright test TestScripts/Workflow_creation.ts --project=chromium --workers=1
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
    - name: Upload Excel Test Data Results
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: test-data-results
        path: TestData/
        retention-days: 30
    - name: Send Email with Excel Results
      uses: dawidd6/action-send-mail@v4
      if: always()
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.MAIL_USERNAME }}
        password: ${{ secrets.MAIL_PASSWORD }}
        subject: Playwright Test Results - Excel Data Attached
        to: ${{ secrets.RECIPIENT_EMAIL }}
        from: Playwright CI Pipeline <playwright-ci@github.com>
        body: |
          Hello,
          
          The Playwright automation run has finished.
          Please find the generated Excel spreadsheet with the test results attached.
          
          Best regards,
          CI Automation Pipeline
        attachments: TestData/WorkflowTestingQuestion.xlsx
